name: TEMP test yt-dlp captions datacenter IP

# Throwaway diagnostic, not a real CI check. Render's free-tier build
# minutes ran out mid-session while adding a PO-token provider and a
# YouTube-captions fast-path to the genAI local fallback's AUDIO_EXTRACTION
# stage (see LocalAudioExtractionService.ts / fetch_captions.py) -- both were
# meant to remove the fallback's dependency on manually-refreshed cookies,
# but neither has been verified against a real datacenter IP yet, and
# Render itself is unavailable to test against until its billing period
# resets. GitHub Actions runners are also on cloud/datacenter IPs (Azure)
# and this account's Actions minutes are a separate, untouched free-tier
# quota, so this runs the same commands in isolation (no app, no database,
# no credentials needed) to get that answer without waiting.
#
# Delete this workflow once the answer is known either way.

on:
  workflow_dispatch:
  # workflow_dispatch alone proved unreliable to trigger via API/CLI right
  # after a workflow is first added -- GitHub can take a long, unpredictable
  # time to make a brand-new workflow_dispatch trigger dispatchable, with no
  # way to force it. push on a dedicated throwaway branch fires immediately
  # as part of the same push that adds/updates the file, sidestepping that.
  push:
    branches:
      - tmp-test-datacenter-ip-ytdlp

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install python deps
        run: pip install yt-dlp bgutil-ytdlp-pot-provider youtube-transcript-api

      - name: Install deno (yt-dlp's JS runtime for the n-challenge)
        run: |
          curl -fsSL https://deno.land/install.sh | sh -s -- --no-modify-path
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install bgutil PO-token provider (script mode)
        run: node backend/scripts/install-bgutil-provider.cjs

      - name: Test captions fetch (youtube-transcript-api) -- no audio download at all
        continue-on-error: true
        run: echo '{"videoId": "jNQXAC9IVRw"}' | python3 backend/scripts/fetch_captions.py

      - name: Test yt-dlp with PO-token + client spoofing, no cookies
        continue-on-error: true
        run: |
          yt-dlp -x --audio-format mp3 --no-playlist \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=android,tv" \
            --extractor-args "youtubepot-bgutilscript:server_home=$PWD/backend/scripts/.bgutil-provider/server" \
            --sleep-requests 1 \
            -o "/tmp/test-audio.%(ext)s" \
            -v \
            "https://www.youtube.com/watch?v=jNQXAC9IVRw"

      - name: Show result
        run: ls -la /tmp/test-audio* 2>&1 || echo "no audio file produced"
