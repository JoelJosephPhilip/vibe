name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'JoelJosephPhilip/vibe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/vicharanashala/vibe.git
          git fetch upstream main

      - name: Skip if already up to date
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main main; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag current main as a restore point
        if: steps.check.outputs.up_to_date == 'false'
        run: git tag "backup/pre-sync-$(date -u +%Y%m%d-%H%M%S)" main

      - name: Merge upstream into main
        if: steps.check.outputs.up_to_date == 'false'
        run: git merge upstream/main --no-edit -m "chore: sync with upstream vicharanashala/vibe"

      - name: Push main and backup tag
        if: steps.check.outputs.up_to_date == 'false'
        run: git push origin main --tags
