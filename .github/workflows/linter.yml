name: Lint and Format Check on Pull Request

on:
  pull_request:
    branches:
      - main # Or your main branch name
    paths:
      - 'backend/**' # Only trigger when files in backend folder are changed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to diff against the PR base

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No version pin: use the repo's `packageManager` (pnpm 10).

      - name: Install dependencies
        run: pnpm install
        working-directory: backend

      - name: Lint changed files
        working-directory: backend
        # Only lints files this PR actually touches — the codebase has a
        # lot of pre-existing lint debt that predates this workflow, so
        # linting everything would fail on unrelated code in every PR.
        run: |
          BASE="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE" --depth=1
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -- backend | grep -E '\.tsx?$' | sed 's|^backend/||' || true)
          if [ -z "$FILES" ]; then
            echo "No changed backend TypeScript files to lint."
            exit 0
          fi
          echo "$FILES"
          npx eslint $FILES